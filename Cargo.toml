[package]
name = "typed-hexdump"
version = "0.1.0"
edition = "2024"
authors = ["SoimanVasile"]
license = "MIT"
description = "A structured, schema-aware hex dump library"
readme = "README.md"
repository = "https://github.com/SoimanVasile/hexDump"

[dependencies]
typed_hexdump_core = { path = "typed_hexdump_core", version = "0.1.0" }
typed_hexdump_derive = { path = "typed_hexdump_derive", version = "0.1.0" }
memmap2 = "0.9.12"

[lib]
name = "typed_hexdump"
path = "src/lib.rs"

[dev-dependencies]
bytemuck = "1.19"
tempfile = "3"
